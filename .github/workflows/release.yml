#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.
#
# --- Adapted with full release pipeline ---
# Adds: build-wheel, smoke-test (ubuntu/macos/windows), publish-crates,
# publish-pypi, create-github-release, smoke-npm, publish-npm.
# The cargo-dist host job is superseded by create-github-release which
# runs after crate and PyPI publishes to ensure the release exists
# before the npm wrapper auto-downloads from it.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  # Release-only: no pull_request trigger. Every build/publish job here is tag-gated, so on a
  # PR they'd only surface as skipped-check noise. Workflow YAML is validated on PRs by the
  # `actionlint` job in ci.yml instead. (The plan job's `!github.event.pull_request` guards are
  # inherited from cargo-dist and harmlessly resolve to the tag path.)
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  # release-please dispatches this workflow at the freshly-created tag. workflow_dispatch
  # fires even from GITHUB_TOKEN (unlike a tag push), so no PAT is needed to chain the two.
  workflow_dispatch:

jobs:
  # ==========================================================================
  # cargo-dist jobs (generated by `dist init`, kept intact)
  # ==========================================================================

  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 15
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # Exact crate version plus --locked uses crates.io's immutable package
        # checksum and the release's committed dependency lock.
        run: cargo install cargo-dist --version 0.31.0 --locked
      - name: Cache dist
        uses: actions/upload-artifact@v6
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # ==========================================================================
  # Custom release pipeline jobs
  #
  # Dependency chain:
  #   [dist builds + wheel] --> prepare-release (manifest + one npm pack)
  #       --> smoke-test --> create-github-release --> smoke-npm
  #       --> publish-crates + publish-pypi + publish-npm --> registry-readback
  #
  # All custom jobs gate on startsWith(github.ref, 'refs/tags/v') so they
  # only execute on tag pushes, not on PR plan-only runs.
  #
  # Release SOP — tag naming:
  #   Tags MUST be pushed as vMAJOR.MINOR.PATCH (e.g. v1.0.0). A bare
  #   1.0.0 tag satisfies the cargo-dist on.push.tags pattern above but
  #   is NOT a supported release trigger for the custom jobs: all of them
  #   gate on startsWith(github.ref, 'refs/tags/v'), so a tag without the
  #   leading "v" will run the dist build but skip every custom job
  #   (wheel, smoke, publish, release creation). Always use the v prefix.
  #
  # Artifact-action versions:
  #   The cargo-dist-managed jobs (plan, build-local-artifacts,
  #   build-global-artifacts) pin upload-artifact@v6 / download-artifact@v7
  #   as emitted by dist init. The custom jobs below use the same generation
  #   (upload-artifact@v6 / download-artifact@v7) for artifact-transfer
  #   compatibility — cross-major transfers (e.g. v4 download of a v6 upload)
  #   are fragile per GitHub docs. Do not edit the versions in the
  #   dist-managed section; cargo-dist regenerates them on `dist init`.
  # ==========================================================================

  # Build Python wheel via maturin
  build-wheel:
    needs:
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install pinned maturin
        run: cargo install maturin --version 1.13.1 --locked

      - name: Build wheel
        run: maturin build --release --out ../../dist
        working-directory: crates/schemalint-python

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheels
          path: dist/*.whl

  # Assemble final bytes, generate the npm-shipped digest manifest, and pack
  # npm exactly once. Every later job consumes this immutable bundle.
  prepare-release:
    needs:
      - build-local-artifacts
      - build-global-artifacts
      - build-wheel
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download final native artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-build-*
          path: release-bundle
          merge-multiple: true

      - name: Download final wheel
        uses: actions/download-artifact@v7
        with:
          name: wheels
          path: release-bundle

      - name: Remove internal dist manifests
        run: rm -f release-bundle/*-dist-manifest.json

      - name: Validate tag and package version parity
        run: node scripts/validate-native-manifest.cjs --versions-only --tag "${{ github.ref_name }}"
        working-directory: npm/schemalint

      - name: Generate immutable native manifest from final archives
        run: node scripts/generate-native-manifest.cjs ../../release-bundle native-manifest.json
        working-directory: npm/schemalint

      - name: Build and pack npm once
        run: |
          npm ci
          npm run build
          node scripts/validate-native-manifest.cjs --release --tag "${{ github.ref_name }}"
          npm pack --pack-destination ../../release-bundle
        working-directory: npm/schemalint

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle
          path: release-bundle/*

  # Smoke-test binaries on all three platforms
  smoke-test:
    needs:
      - prepare-release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download immutable release bundle
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: release-bundle

      - name: Extract and smoke-test binary (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          set -e
          ARCHIVE="schemalint-${{ matrix.target }}.${{ matrix.ext }}"
          echo "Extracting: $ARCHIVE"
          mkdir -p _smoke
          tar xzf "release-bundle/$ARCHIVE" -C _smoke
          BIN="$(find _smoke -maxdepth 3 -type f -name schemalint | head -n1)"
          if [ -z "$BIN" ]; then
            echo "::error::schemalint binary not found in archive $ARCHIVE"
            ls -R _smoke
            exit 1
          fi
          chmod +x "$BIN"
          echo "Running: schemalint --version"
          VERSION_OUTPUT=$("$BIN" --version)
          echo "$VERSION_OUTPUT"
          echo "Running: schemalint check (minimal schema)"
          echo '{"type": "object", "properties": {"name": {"type": "string"}}, "required": ["name"], "additionalProperties": false}' > test-schema.json
          "$BIN" check test-schema.json --profile openai.so.2026-04-30

      - name: Extract and smoke-test binary (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "schemalint-${{ matrix.target }}.${{ matrix.ext }}"
          Write-Host "Extracting: $archive"
          New-Item -ItemType Directory -Force -Path _smoke | Out-Null
          Expand-Archive -Path "release-bundle/$archive" -DestinationPath _smoke
          $bin = Get-ChildItem -Path _smoke -Recurse -Filter schemalint.exe | Select-Object -First 1
          if (-not $bin) {
            Write-Error "schemalint.exe not found in archive $archive"
            Get-ChildItem -Path _smoke -Recurse
            exit 1
          }
          # Do NOT capture native stdout into a variable: under $ErrorActionPreference=Stop,
          # pwsh 7.4 throws "StandardOutputEncoding is only supported when standard output is
          # redirected". Run directly and check $LASTEXITCODE explicitly.
          Write-Host "Running: schemalint --version"
          & $bin.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "schemalint --version failed (exit $LASTEXITCODE)" }
          Write-Host "Running: schemalint check (minimal schema)"
          '{"type": "object", "properties": {"name": {"type": "string"}}, "required": ["name"], "additionalProperties": false}' | Out-File -Encoding ascii test-schema.json
          & $bin.FullName check test-schema.json --profile openai.so.2026-04-30
          if ($LASTEXITCODE -ne 0) { throw "schemalint check failed (exit $LASTEXITCODE)" }

      - name: Smoke-test Python wheel (ubuntu only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -e
          pip install release-bundle/*.whl
          schemalint --version
          echo '{"type": "object", "properties": {"name": {"type": "string"}}, "required": ["name"], "additionalProperties": false}' > test-schema.json
          schemalint check test-schema.json --profile openai.so.2026-04-30

      - name: Verify staged npm tarball inventory (ubuntu only)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          mkdir npm-smoke
          tar xzf release-bundle/*.tgz -C npm-smoke
          test -f npm-smoke/package/native-manifest.json
          test -f npm-smoke/package/launcher/integrity.cjs

  # Publish Rust crates to crates.io
  publish-crates:
    needs:
      - smoke-npm
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Single schemalint crate (profiles folded in); one verify-build, allow headroom.
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Authenticate to crates.io via OIDC (trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish schemalint
        run: |
          published=false
          for i in 1 2 3; do
            out=$(cargo publish -p schemalint 2>&1) && { published=true; echo "$out"; break; }
            echo "$out"
            if echo "$out" | grep -qiE "already (uploaded|exists)"; then
              echo "crate version already published; treating as success"
              published=true; break
            fi
            echo "cargo publish attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$published" != true ]; then
            echo "::error::cargo publish failed after 3 attempts"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Publish Python wheel to PyPI
  publish-pypi:
    needs:
      - prepare-release
      - smoke-npm
    # PyPI publishing is gated off (skipped, not failed) so the release stays green
    # without a PYPI_TOKEN. To enable: wire trusted publishing like publish-npm
    # (id-token: write + remove the password line + add a pypi pending publisher),
    # then set repo variable PUBLISH_PYPI=true.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/schemalint/
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: release-bundle

      - name: Isolate staged wheel
        run: |
          mkdir pypi-dist
          cp release-bundle/*.whl pypi-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: pypi-dist/
          skip-existing: true

  # Create GitHub assets only after every local artifact smoke passes.
  create-github-release:
    needs:
      - smoke-test
      - prepare-release
    if: ${{ needs.smoke-test.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download immutable release bundle
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false

  # Smoke-test npm wrapper auto-download (requires GitHub Release to exist)
  smoke-npm:
    needs:
      - create-github-release
      - prepare-release
    # Install and exercise the exact tarball packed before GitHub assets existed.
    if: ${{ !cancelled() && needs.create-github-release.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      SCHEMALINT_CACHE_DIR: ${{ github.workspace }}/schemalint-cache
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the exact staged npm tarball
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: release-bundle

      - name: Install packed package globally
        shell: bash
        run: npm install -g release-bundle/*.tgz

      - name: Smoke-test installed CLI
        shell: bash
        run: |
          schemalint --version
          echo '{"type": "object", "properties": {"name": {"type": "string"}}, "required": ["name"], "additionalProperties": false}' > test-schema.json
          schemalint check test-schema.json --profile openai.so.2026-04-30

  # Publish all npm packages
  publish-npm:
    needs:
      - smoke-npm
      - prepare-release
    # @1nder-labs/schemalint was bootstrapped by hand for its first publish; from here on
    # publish-npm runs on every tagged release via OIDC trusted publishing (no token, no OTP).
    if: ${{ !cancelled() && needs.smoke-npm.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    environment:
      name: npm
      url: https://www.npmjs.com/package/@1nder-labs/schemalint
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm for trusted publishing
        run: npm install -g npm@11.6.2

      - name: Download the exact staged npm tarball
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: release-bundle

      - name: Publish @1nder-labs/schemalint
        run: |
          published=false
          for i in 1 2 3; do
            out=$(npm publish release-bundle/*.tgz --access public 2>&1) && { published=true; echo "$out"; break; }
            echo "$out"
            if echo "$out" | grep -qiE "previously published|cannot publish over|You cannot publish over|already exists"; then
              echo "package version already published; treating as success"
              published=true; break
            fi
            echo "npm publish attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$published" != true ]; then
            echo "::error::npm publish failed after 3 attempts"
            exit 1
          fi

  registry-readback:
    needs:
      - publish-crates
      - publish-pypi
      - publish-npm
    if: ${{ always() && needs.publish-crates.result == 'success' && needs.publish-npm.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download staged artifacts for digest readback
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: release-bundle

      - name: Read back npm registry version and exact tarball digest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(npm view "@1nder-labs/schemalint@$VERSION" version)" = "$VERSION"
          EXPECTED="sha512-$(openssl dgst -sha512 -binary release-bundle/*.tgz | openssl base64 -A)"
          test "$(npm view "@1nder-labs/schemalint@$VERSION" dist.integrity)" = "$EXPECTED"

      - name: Read back crates.io version
        run: curl --fail --silent "https://crates.io/api/v1/crates/schemalint/${GITHUB_REF_NAME#v}" > /dev/null

      - name: Read back PyPI version when published
        if: ${{ needs.publish-pypi.result == 'success' }}
        run: curl --fail --silent "https://pypi.org/pypi/schemalint/${GITHUB_REF_NAME#v}/json" > /dev/null
