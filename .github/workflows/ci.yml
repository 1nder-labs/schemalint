name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        # Validate workflow YAML schema + ${{ }} expression contexts across all workflows
        # (catches the class of bug that once made release.yml an "invalid workflow file").
        # shellcheck disabled: cargo-dist's generated release.yml shell trips harmless
        # SC2086/SC2129 style/info findings we don't own and won't churn.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11 -shellcheck= -color

  core:
    name: Core source suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: npm/schemalint/package-lock.json

      - name: Install npm/schemalint dependencies
        run: npm ci
        working-directory: npm/schemalint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pydantic test dependency
        run: pip install pydantic

      - name: Expose the source-tree Python sidecar
        run: echo "PYTHONPATH=$PWD/crates/schemalint-python/python" >> "$GITHUB_ENV"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build and test
        run: cargo test --workspace --exclude schemalint-python

      - name: Run clippy
        run: cargo clippy --workspace --exclude schemalint-python -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile benchmarks
        run: cargo bench --no-run --workspace --exclude schemalint-python

  python-wrapper:
    name: Python wrapper source gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build wrapper
        run: cargo build -p schemalint-python

      - name: Lint wrapper
        run: cargo clippy -p schemalint-python -- -D warnings

  python-source:
    name: Python sidecar source suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python test dependencies
        run: python -m pip install 'pydantic>=2,<3' pytest

      - name: Run Python tests
        run: python -m pytest crates/schemalint-python/python/tests

  npm-source:
    name: npm source and generated dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: npm/schemalint/package-lock.json

      - name: Install, build, and test npm package
        run: |
          npm ci
          npm run build
          npm test
        working-directory: npm/schemalint

      - name: Check generated TypeScript distribution
        run: git diff --exit-code -- npm/schemalint/dist

  npm-packed:
    name: Packed npm (Node ${{ matrix.node }}, Zod ${{ matrix.zod }} ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '18'
            zod: '3.25.76'
            mode: full
          - node: '20'
            zod: '4.0.1'
            mode: full
          - node: '22'
            zod: '4.4.3'
            mode: full
          - node: '20'
            zod: '4.4.3'
            mode: mini
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm/schemalint/package-lock.json

      - name: Build package
        run: |
          npm ci
          npm run build
        working-directory: npm/schemalint

      # Pull-request CI has no final native archives, so it packs without the
      # release-only prepack hook and tests the installed TypeScript sidecar.
      # release.yml remains the sole immutable native-manifest transaction.
      - name: Pack and smoke installed runtime
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          TARBALL=$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)
          node ../../scripts/smoke-packed-node.cjs \
            "$TARBALL" "${{ matrix.zod }}" "${{ matrix.mode }}"
        working-directory: npm/schemalint

  npm-sdk-consumer:
    name: Packed npm with real SDKs (${{ matrix.row }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        row: [minimum, current]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: npm/schemalint/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI and packed npm package
        run: |
          cargo build -p schemalint
          npm ci
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
        working-directory: npm/schemalint

      - name: Smoke installed package with pinned real SDKs
        run: |
          TARBALL=$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)
          node ../../scripts/smoke-packed-sdk-consumers.cjs \
            "$TARBALL" "${{ matrix.row }}" "$GITHUB_WORKSPACE/target/debug/schemalint"
        working-directory: npm/schemalint

  python-wheel-build:
    name: Build Python wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install pinned build tooling
        run: |
          cargo install maturin --version 1.13.1 --locked
          python -m pip install pytest

      - name: Build and inspect wheel
        run: |
          maturin build --release --out ../../wheelhouse
          SCHEMALINT_WHEEL=$(find ../../wheelhouse -name '*.whl' -print -quit) \
            python -m pytest python/tests/test_wheel_contract.py
        working-directory: crates/schemalint-python

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: ci-wheel
          path: wheelhouse/*.whl

  python-wheel:
    name: Wheel (${{ matrix.python }}, ${{ matrix.pydantic_label }})
    needs: python-wheel-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            pydantic: '>=1.10,<2'
            pydantic_label: Pydantic v1
          - python: '3.13'
            pydantic: '>=2,<3'
            pydantic_label: Pydantic v2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheel
        uses: actions/download-artifact@v7
        with:
          name: ci-wheel
          path: wheelhouse

      - name: Install wheel and supported Pydantic line
        run: python -m pip install "pydantic${{ matrix.pydantic }}" wheelhouse/*.whl

      - name: Smoke public command and bundled sidecar
        run: python scripts/smoke-installed-wheel.py

  conformance:
    name: Offline provider conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compare linter with the offline truth engine
        run: cargo test -p schemalint-conformance --test truth_integration_tests

  generated-docs:
    name: Generated artifacts and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            npm/schemalint/package-lock.json
            docs/package-lock.json

      - name: Regenerate rule reference
        run: cargo run --bin schemalint-docgen

      - name: Check generated rule reference
        run: git diff --exit-code -- docs/docs/rules

      - name: Regenerate TypeScript distribution
        run: |
          npm ci
          npm run build
        working-directory: npm/schemalint

      - name: Check generated TypeScript distribution
        run: git diff --exit-code -- npm/schemalint/dist

      - name: Build documentation site
        run: |
          npm ci
          npm run build
        working-directory: docs

  source-size:
    name: Production source size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check-source-size.py

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check build with MSRV
        run: cargo build --workspace --exclude schemalint-python

  bench-gate:
    name: Benchmark Gate
    runs-on: ubuntu-latest
    needs: core
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: |
          cargo bench --bench schemalint_benchmarks -- --output-format bencher > bench_output.txt
          cat bench_output.txt

      - name: Check thresholds
        run: bash scripts/check-benchmarks.sh bench_output.txt

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: core
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: npm/schemalint/package-lock.json

      - name: Install npm/schemalint dependencies
        run: npm ci
        working-directory: npm/schemalint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pydantic test dependency
        run: pip install pydantic

      - name: Expose the source-tree Python sidecar
        run: echo "PYTHONPATH=$PWD/crates/schemalint-python/python" >> "$GITHUB_ENV"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage
        run: |
          cargo llvm-cov --workspace --exclude schemalint-python --lcov --output-path lcov.info

      # Coverage gate is the measured floor of the core crate (currently ~87.6%).
      # The Phase-6 plan's 90% target is partially unmet: the residual gap is the
      # subprocess/sidecar layer (node/python helpers, stdout/stderr I/O caps),
      # whose failure branches need a process-spawning failure-injection harness.
      # That harness is deferred post-v1.0 to avoid flaky integration tests; the
      # gate is set to the honestly-achieved floor and ratcheted up as it rises.
      - name: Check coverage threshold
        run: bash scripts/check-coverage.sh lcov.info 86.00

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
