[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "schemalint"
version = "1.2.0"
description = "Static analysis for JSON Schema compatibility with LLM structured-output providers"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/1nder-labs/schemalint"
Documentation = "https://1nder-labs.github.io/schemalint"
Repository = "https://github.com/1nder-labs/schemalint"

# Maturin's bin binding installs the Cargo binary target directly as
# `schemalint`; no Python script shim or runtime package installation is used.

[tool.maturin]
bindings = "bin"
python-source = "python"
python-packages = ["schemalint", "schemalint_pydantic"]
manifest-path = "Cargo.toml"
