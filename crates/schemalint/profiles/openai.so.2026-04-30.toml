name = "openai.so.2026-04-30"
version = "2026-04-30"
code_prefix = "OAI"

# String keywords
type = "allow"
properties = "allow"
required = "allow"
additionalProperties = { kind = "restricted", allowed = [false] }
items = "allow"
prefixItems = "warn"
minItems = "allow"
maxItems = "allow"
uniqueItems = "forbid"
contains = "forbid"
minimum = "allow"
maximum = "allow"
exclusiveMinimum = "allow"
exclusiveMaximum = "allow"
multipleOf = "allow"
# minLength and maxLength warn rather than allow: OpenAI's Structured
# Outputs guide lists only `pattern` and `format` among supported string
# properties, and never names these two. Not documented as rejected either,
# so warn rather than forbid.
minLength = "warn"
maxLength = "warn"
pattern = "allow"
format = { kind = "restricted", allowed = ["date-time", "time", "date", "duration", "email", "hostname", "ipv4", "ipv6", "uuid"] }
enum = "allow"
const = "allow"
# patternProperties warns: OpenAI's guide names it only as an exclusion for
# fine-tuned models, implying it was never on the standard supported list.
# Not documented as rejected, so warn rather than forbid.
patternProperties = "warn"
unevaluatedProperties = "forbid"
propertyNames = "forbid"
minProperties = "forbid"
maxProperties = "forbid"
description = "allow"
title = "allow"
default = "allow"
# discriminator warns: it is an OpenAPI keyword, not JSON Schema, and is
# absent from OpenAI's supported list. Not documented as rejected, so warn
# rather than forbid. (The Anthropic profile forbids it outright.)
discriminator = "warn"
"$ref" = "allow"
"$defs" = "allow"
definitions = "allow"
anyOf = "allow"
oneOf = "forbid"
allOf = "forbid"
not = "forbid"
if = "forbid"
then = "forbid"
else = "forbid"
dependentRequired = "forbid"
dependentSchemas = "forbid"

[structural]
require_object_root = true
require_additional_properties_false = true
require_all_properties_in_required = true
require_array_items = true
forbid_root_any_of = true
forbid_root_enum = true
forbid_empty_object = true
# OpenAI rejects schemas exceeding 10 nesting levels ("N levels of nesting
# exceeds limit of 10"). Verified against the live API 2026-06-16; docs that
# still say 5 are stale.
max_object_depth = 10
max_total_properties = 5000
max_total_enum_values = 1000
max_string_length_total = 120000
enum_string_length_threshold = 250
max_enum_string_length = 15000
external_refs = true
# A keyword the engine does not recognize at all (not the same as a
# recognized keyword with unverified provider status) warns rather than
# errors: common, unrecognized keys such as $id or examples are not
# documented as rejected by any provider.
unknown_keyword_policy = "warn"

# Provider evidence. Keys are diagnostic codes without the provider prefix.
[[evidence]]
key = "S-max-depth"
status = "live_verified"
basis = "Observed from the OpenAI API; the published nesting limit is stale for the tested target."
verifiedAt = "2026-06-16"
verificationTarget = "OpenAI Structured Outputs API"
sources = [{ title = "OpenAI schema limits", url = "https://developers.openai.com/api/docs/guides/structured-outputs#objects-have-limitations-on-nesting-depth-and-size" }]

[[evidence]]
key = "K-discriminator"
status = "inferred"
basis = "OpenAPI-only keyword absent from OpenAI's supported JSON Schema subset."
sources = [{ title = "OpenAI supported schemas", url = "https://developers.openai.com/api/docs/guides/structured-outputs#supported-schemas" }]

[[evidence]]
key = "K-minLength"
status = "inferred"
basis = "Absent from the documented supported string constraints."
sources = [{ title = "OpenAI type-specific keywords", url = "https://developers.openai.com/api/docs/guides/structured-outputs#some-type-specific-keywords-are-not-yet-supported" }]

[[evidence]]
key = "K-maxLength"
status = "inferred"
basis = "Absent from the documented supported string constraints."
sources = [{ title = "OpenAI type-specific keywords", url = "https://developers.openai.com/api/docs/guides/structured-outputs#some-type-specific-keywords-are-not-yet-supported" }]

[[evidence]]
key = "K-patternProperties"
status = "inferred"
basis = "Mentioned only as unavailable for fine-tuned models, not as supported for the standard subset."
sources = [{ title = "OpenAI type-specific keywords", url = "https://developers.openai.com/api/docs/guides/structured-outputs#some-type-specific-keywords-are-not-yet-supported" }]

[[evidence]]
key = "S-external-refs"
status = "inferred"
basis = "OpenAI documents local definitions, but not external reference retrieval."
sources = [{ title = "OpenAI definitions", url = "https://developers.openai.com/api/docs/guides/structured-outputs#definitions-are-supported" }]

[[evidence]]
key = "S-empty-object"
status = "live_verified"
basis = "Observed rejection of an object schema without properties."
verifiedAt = "2026-06-16"
verificationTarget = "OpenAI Structured Outputs API"
sources = [{ title = "OpenAI object restrictions", url = "https://developers.openai.com/api/docs/guides/structured-outputs#additionalproperties-false-must-always-be-set-in-objects" }]

[[evidence]]
key = "S-additional-properties-object"
status = "inferred"
basis = "The documented subset requires additionalProperties to be false."
sources = [{ title = "OpenAI additionalProperties", url = "https://developers.openai.com/api/docs/guides/structured-outputs#additionalproperties-false-must-always-be-set-in-objects" }]

[[evidence]]
key = "S-anyof-objects"
