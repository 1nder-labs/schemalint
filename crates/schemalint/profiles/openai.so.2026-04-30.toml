sources = [{ title = "OpenAI anyOf requirements", url = "https://developers.openai.com/api/docs/guides/structured-outputs#for-anyof-the-nested-schemas-must-each-be-a-valid-json-schema-per-this-subset" }]

[[evidence]]
key = "S-unknown-keyword"
status = "inferred"
basis = "Unknown keywords are not covered by the documented supported subset."
sources = [{ title = "OpenAI supported schemas", url = "https://developers.openai.com/api/docs/guides/structured-outputs#supported-schemas" }]

