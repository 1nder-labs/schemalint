# This profile gates Anthropic's strict and structured-output pipeline:
# `strict: true` tool schemas and `output_config.format`. Anthropic restricts
# JSON Schema only for that pipeline; ordinary (non-strict) tool use carries
# no documented keyword restriction (KTD6). Sources:
#   https://platform.claude.com/docs/en/build-with-claude/structured-outputs
#   https://platform.claude.com/docs/en/agents-and-tools/tool-use/strict-tool-use
#
# Every entry below is either a documented statement from those two pages or
# an annotated inference. Where a comment is silent, treat the entry as
# directly documented.

name = "anthropic.so.2026-04-30"
version = "2026-04-30"
code_prefix = "ANT"

# Supported keywords
type = "allow"
properties = "allow"
required = "allow"
items = "allow"
enum = "allow"
const = "allow"
anyOf = "allow"
allOf = "allow"
"$ref" = "allow"
"$defs" = "allow"
definitions = "allow"
description = "allow"
title = "allow"
default = "allow"
pattern = "allow"

# Restricted keywords
additionalProperties = { kind = "restricted", allowed = [false] }
format = { kind = "restricted", allowed = ["date-time", "time", "date", "duration", "email", "hostname", "uri", "ipv4", "ipv6", "uuid"] }
minItems = { kind = "restricted", allowed = [0, 1] }

# Forbidden keywords — documented by name as unsupported.
minimum = "forbid"
maximum = "forbid"
multipleOf = "forbid"
minLength = "forbid"
maxLength = "forbid"
maxItems = "forbid"
uniqueItems = "forbid"
contains = "forbid"
prefixItems = "forbid"

# Forbidden keywords — inference only. The documentation lists numeric-range
# rejection as an example set introduced with "such as", which is
# non-exhaustive; it never names exclusiveMinimum or exclusiveMaximum
# directly. Treated as forbidden because they carry the same numeric-range
# shape as the documented minimum/maximum entries above.
exclusiveMinimum = "forbid"
exclusiveMaximum = "forbid"

# Forbidden keywords — no documented basis at all. Anthropic's documentation
# never names these seven. They stay forbidden because they are conditional
# or cross-field applicators, the same shape as keywords the documentation
# does reject, and a fail-closed reading is the safer default until Anthropic
# publishes a statement either way (KTD7).
not = "forbid"
if = "forbid"
then = "forbid"
else = "forbid"
dependentRequired = "forbid"
dependentSchemas = "forbid"
discriminator = "forbid"

# Unknown keywords — genuinely undocumented. Anthropic's documentation makes
# no statement, inference-worthy or otherwise, about any of these six.
oneOf = "unknown"
patternProperties = "unknown"
unevaluatedProperties = "unknown"
propertyNames = "unknown"
minProperties = "unknown"
maxProperties = "unknown"

[structural]
# Documented: the Messages API `input_schema` (and `output_config.format`)
# requires `type: "object"` at the root.
require_object_root = true
require_additional_properties_false = true
require_all_properties_in_required = false
max_object_depth = 0
max_total_properties = 0
max_total_enum_values = 0
max_string_length_total = 0
external_refs = true
forbid_allof_with_ref = true
# Documented: Anthropic's structured-outputs page names "Recursive schemas"
# among the unsupported schema features. See KTD11 for why the rule fires
# once per cycle rather than once per cyclic node.
forbid_recursive_schemas = true
# A keyword the engine does not recognize at all (not the same as a
# recognized keyword with unverified provider status) warns rather than
# errors: common, unrecognized keys such as $id or examples are not
# documented as rejected by any provider.
unknown_keyword_policy = "warn"
